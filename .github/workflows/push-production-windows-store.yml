name: Push Production Windows Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.1.1); defaults to the version in pubspec.yaml"
        required: false
        default: ""

jobs:
  build-and-pack-msix:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/pseudolearn_app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: apps/pseudolearn_app/pubspec.yaml

      - name: Install core package dependencies
        working-directory: packages/pseudolearn_core
        run: dart pub get

      - name: Install app dependencies
        run: flutter pub get

      - name: Set up Rust bridge
        uses: ./.github/actions/setup-rust-bridge
        with:
          targets: x86_64-pc-windows-msvc

      - name: Resolve release version
        id: resolve-version
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
            if ($null -eq $line) {
              Write-Error "pubspec.yaml has no version field"
              exit 1
            }
            $ver = $line.Matches[0].Groups[1].Value
          }
          if ($ver.StartsWith("v")) {
            $ver = $ver.Substring(1)
          }
          $ver = $ver.Split("+")[0]
          Write-Host "Resolved version: $ver"
          echo "VERSION=$ver" >> $env:GITHUB_ENV

      - name: Write build-time auth configuration
        shell: pwsh
        run: |
          $config = @{
            SUPABASE_URL = "${{ secrets.SUPABASE_URL }}"
            SUPABASE_ANON_KEY = "${{ secrets.SUPABASE_ANON_KEY }}"
          } | ConvertTo-Json
          Set-Content -Path dart_define.ci.json -Value $config

      - name: Build Windows release bundle
        shell: pwsh
        run: |
          flutter build windows --release `
            --dart-define-from-file=dart_define.ci.json `
            --build-name=$env:VERSION `
            --build-number=$env:GITHUB_RUN_NUMBER

      - name: Verify and exercise bundled Rust asset
        shell: pwsh
        run: |
          $nativeAsset = "build\native_assets\windows\pseudolearn_bridge.dll"
          $bundleAsset = "build\windows\x64\runner\Release\pseudolearn_bridge.dll"
          if (-not (Test-Path $nativeAsset) -or -not (Test-Path $bundleAsset)) {
            throw "The Rust native asset is missing from the Windows build or application bundle."
          }
          $env:FRB_DART_LOAD_EXTERNAL_LIBRARY_NATIVE_LIB_DIR = (Resolve-Path "build\native_assets\windows").Path
          flutter test --no-pub tool/native_bridge_test.dart tool/native_bridge_adapters_test.dart
          Remove-Item Env:FRB_DART_LOAD_EXTERNAL_LIBRARY_NATIVE_LIB_DIR
          flutter test --no-pub --device-id windows integration_test/native_engine_smoke_test.dart

      - name: Verify bundled Visual C++ runtime
        shell: pwsh
        run: |
          $bundle = "build\windows\x64\runner\Release"
          $missing = @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") |
            Where-Object { -not (Test-Path (Join-Path $bundle $_)) }
          if ($missing.Count -gt 0) {
            Write-Error "Visual C++ runtime missing from the bundle: $($missing -join ', ')"
            exit 1
          }

      - name: Pack MSIX for Microsoft Store
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packaging/windows/Output
          $outputPath = (Resolve-Path packaging/windows/Output).Path
          dart run msix:create `
            --build-windows false `
            --version "$($env:VERSION).0" `
            --output-path $outputPath `
            --output-name PseudoLearn-Store `
            -v

      - name: Verify the Rust asset is inside the MSIX
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "packaging\windows\Output\PseudoLearn-Store.msix"))
          try {
            $library = $archive.Entries | Where-Object { $_.FullName -match '(^|/)pseudolearn_bridge\.dll$' }
            if ($null -eq $library) {
              throw "The packaged MSIX does not contain pseudolearn_bridge.dll."
            }
          } finally {
            $archive.Dispose()
          }

      - name: Upload MSIX artifact to GitHub Actions
        uses: actions/upload-artifact@v7
        with:
          name: pseudolearn-store-windows-${{ env.VERSION }}
          path: apps/pseudolearn_app/packaging/windows/Output/PseudoLearn-Store.msix
