name: Push Production Web

on:
  workflow_dispatch:

concurrency:
  group: push-production-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Workers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/fe-pseudolearn
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: apps/pseudolearn_app/pubspec.yaml
          cache: true
      - run: flutter pub get
        working-directory: apps/pseudolearn_app
      - uses: ./.github/actions/setup-rust-bridge
        with:
          targets: x86_64-unknown-linux-gnu
      - run: cargo build --release --locked --lib --manifest-path native/Cargo.toml
        working-directory: apps/pseudolearn_app
      - run: flutter test tool/generate_product_shot.dart
        env:
          FRB_DART_LOAD_EXTERNAL_LIBRARY_NATIVE_LIB_DIR: ${{ github.workspace }}/apps/pseudolearn_app/native/target/release
        working-directory: apps/pseudolearn_app
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install fonttools
      - run: python3 -m pseudolearn_brand build
        working-directory: packages/pseudolearn_brand
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/fe-pseudolearn/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/fe-pseudolearn/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/fe-pseudolearn
