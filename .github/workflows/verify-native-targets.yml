name: Verify Native Targets

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verify-native-targets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-target:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: macos-13
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install the pinned Rust toolchain and target
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target "${{ matrix.target }}"
          rustup show

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/pseudolearn_spec/target
            apps/pseudolearn_cli/target
          key: native-target-${{ matrix.target }}-${{ hashFiles('packages/pseudolearn_engine/Cargo.lock', 'packages/pseudolearn_spec/Cargo.lock', 'apps/pseudolearn_cli/Cargo.lock') }}
          restore-keys: native-target-${{ matrix.target }}-

      - name: Generate the corpus export
        working-directory: packages/pseudolearn_spec
        run: cargo run --locked -p see_cli --bin see -- export --root .

      - name: Build pseudo
        working-directory: apps/pseudolearn_cli
        run: |
          mkdir -p "${{ runner.temp }}/native-target-logs"
          cargo build --release --locked 2>&1 | tee "${{ runner.temp }}/native-target-logs/build-pseudo.log"
          exit "${PIPESTATUS[0]}"

      - name: Build and run the acceptance programs
        working-directory: apps/pseudolearn_cli
        run: python -I tool/verify_native_target.py "target/release/pseudo" "${{ matrix.target }}" "${{ runner.temp }}/native-target-logs"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-target-${{ matrix.target }}
          path: ${{ runner.temp }}/native-target-logs
          if-no-files-found: warn
