[advisories]
version = 2
[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Zlib", "BSD-3-Clause", "ISC", "CDLA-Permissive-2.0"]
[licenses.private]
ignore = true
[bans]
multiple-versions = "deny"
wildcards = "deny"
[sources]
unknown-registry = "deny"
unknown-git = "deny"
