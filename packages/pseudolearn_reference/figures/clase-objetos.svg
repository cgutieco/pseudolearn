  <text x="170" y="50" font-size="12" text-anchor="middle" font-family="mono" fill="@tinta">{{codigo:x Como Entero}}</text>
  <text x="170" y="68" font-size="12" text-anchor="middle" font-family="mono" fill="@tinta">{{codigo:yy Como Entero}}</text>
