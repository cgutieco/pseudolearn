<svg viewBox="0 0 340 260">
  <caja x="110" y="8" ancho="120" alto="30" rol="hueco" discontinua="" fondo="0.06" fuente="mono" tamano="12" texto="{{t:vacia}}"/>
  <flecha puntos="170,38 170,56"/>
