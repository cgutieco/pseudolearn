  <text x="170" y="93" font-size="12" text-anchor="middle" font-family="mono" fill="@tinta">{{codigo:puntos &gt; 50}}</text>
  <flecha puntos="110,88 60,88 60,130"/>
  <flecha puntos="230,88 280,88 280,130"/>
  <text x="80" y="80" font-size="12" text-anchor="middle" fill="@logico">{{codigo:Verdadero}}</text>
  <text x="260" y="80" font-size="12" text-anchor="middle" fill="@logico">{{codigo:Falso}}</text>
  <caja x="10" y="132" ancho="100" alto="30" rol="atenuado" fondo="0.04" fuente="mono" tamano="12" texto="{{codigo:premio &lt;- 10}}"/>
  <caja x="230" y="132" ancho="100" alto="30" rol="atenuado" discontinua="" fondo="0.0" colortexto="atenuado" tamano="12" texto="{{t:nada}}"/>
  <flecha puntos="60,162 60,200 140,200"/>
  <flecha puntos="280,162 280,200 200,200"/>
  <caja x="110" y="210" ancho="120" alto="30" rol="atenuado" fondo="0.04" fuente="mono" tamano="12" texto="{{codigo:Escribir premio}}"/>
  <g data-paso="2">
    <rect x="10" y="132" width="100" height="30" rx="6" fill="@superficie"/>
    <caja x="10" y="132" ancho="100" alto="30" rol="exito" fondo="0.14" fuente="mono" tamano="12" texto="{{codigo:premio = 10}}"/>
  </g>
  <g data-paso="3">
    <rect x="230" y="132" width="100" height="30" rx="6" fill="@superficie"/>
    <caja x="230" y="132" ancho="100" alto="30" rol="hueco" discontinua="" fondo="0.10" tamano="12" texto="{{t:sigueVacia}}"/>
  </g>
  <g data-paso="4">
    <rect x="110" y="210" width="120" height="30" rx="6" fill="@superficie"/>
    <caja x="110" y="210" ancho="120" alto="30" rol="error" fondo="0.16" fuente="mono" tamano="12" texto="{{codigo:Escribir premio}}"/>
    <text x="170" y="256" font-size="12" text-anchor="middle" fill="@error">{{t:codigoError}}</text>
