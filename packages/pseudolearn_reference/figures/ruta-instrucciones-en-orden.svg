<svg viewBox="0 0 340 170">
  <text x="10" y="18" font-size="12" fill="@atenuado">{{t:programa}}</text>
  <text x="222" y="18" font-size="12" fill="@atenuado">{{t:salida}}</text>
  <rect x="214" y="28" width="118" height="132" rx="6" fill="@superficie" stroke="@atenuado"/>
  <g data-paso="1" data-hasta="1">
    <rect x="6" y="58" width="200" height="22" rx="4" fill="@acento-estructurado" fill-opacity="0.18"/>
  </g>
  <g data-paso="2" data-hasta="2">
    <rect x="6" y="84" width="200" height="22" rx="4" fill="@acento-estructurado" fill-opacity="0.18"/>
  </g>
  <g data-paso="3" data-hasta="3">
    <rect x="6" y="110" width="200" height="22" rx="4" fill="@acento-estructurado" fill-opacity="0.18"/>
  </g>
  <text x="12" y="48" font-size="12" font-family="mono" fill="@tinta">{{codigo:Algoritmo Hola}}</text>
  <text x="24" y="74" font-size="12" font-family="mono" fill="@tinta">{{codigo:Escribir "Hola";}}</text>
  <text x="24" y="100" font-size="12" font-family="mono" fill="@tinta">{{codigo:Escribir 2 + 3;}}</text>
  <text x="24" y="126" font-size="12" font-family="mono" fill="@tinta">{{codigo:Escribir "2 + 3";}}</text>
  <text x="12" y="152" font-size="12" font-family="mono" fill="@tinta">{{codigo:FinAlgoritmo}}</text>
  <g data-paso="1">
    <text x="224" y="52" font-size="13" font-family="mono" fill="@texto">{{t:hola}}</text>
  </g>
  <g data-paso="2">
    <text x="224" y="74" font-size="13" font-family="mono" fill="@numero">5</text>
  </g>
  <g data-paso="3">
    <text x="224" y="96" font-size="13" font-family="mono" fill="@texto">2 + 3</text>
  </g>
</svg>
