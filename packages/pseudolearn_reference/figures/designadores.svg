<svg viewBox="0 0 340 200">
  <text x="80" y="20" font-size="13" text-anchor="middle" fill="@exito" font-weight="bold">{{t:lugar}}</text>
  <text x="255" y="20" font-size="13" text-anchor="middle" fill="@atenuado" font-weight="bold">{{t:valor}}</text>
  <caja x="20" y="32" ancho="120" alto="34" rol="exito" fondo="0.12" fuente="mono" texto="{{codigo:x}}"/>
  <caja x="20" y="76" ancho="120" alto="34" rol="exito" fondo="0.12" fuente="mono" texto="{{codigo:notas[i]}}"/>
  <caja x="20" y="120" ancho="120" alto="34" rol="exito" fondo="0.12" fuente="mono" texto="{{codigo:persona.nombre}}"/>
  <caja x="195" y="32" ancho="120" alto="34" rol="atenuado" discontinua="" fondo="0.04" fuente="mono" colortexto="atenuado" texto="5"/>
  <caja x="195" y="76" ancho="120" alto="34" rol="atenuado" discontinua="" fondo="0.04" fuente="mono" colortexto="atenuado" texto="{{codigo:x + 1}}"/>
  <caja x="195" y="120" ancho="120" alto="34" rol="atenuado" discontinua="" fondo="0.04" fuente="mono" colortexto="atenuado" texto="{{codigo:Longitud(t)}}"/>
  <line x1="168" y1="30" x2="168" y2="160" fill="none" stroke="@atenuado" stroke-width="1"/>
  <text x="170" y="188" font-size="12" text-anchor="middle" fill="@tinta">{{t:nota}}</text>
</svg>
