<svg viewBox="0 0 340 160">
  <rect x="10" y="30" width="150" height="100" rx="8" fill="@superficie" stroke="@acento-procedimental"/>
  <text x="85" y="22" font-size="12" text-anchor="middle" fill="@acento-procedimental">{{t:memoria}}</text>
  <rect x="180" y="30" width="150" height="100" rx="8" fill="@superficie" stroke="@acento-estructurado"/>
  <text x="255" y="22" font-size="12" text-anchor="middle" fill="@acento-estructurado">{{t:disco}}</text>
  <caja x="200" y="60" ancho="110" alto="40" rol="acento-estructurado" fondo="0.16" tamano="12" texto="{{t:archivo}}"/>
  <g data-paso="1" data-hasta="1">
    <caja x="22" y="40" ancho="126" alto="24" rol="numero" fondo="0.16" tamano="12" texto="{{t:jugo}}"/>
    <caja x="22" y="68" ancho="126" alto="24" rol="numero" fondo="0.16" tamano="12" texto="{{t:agua}}"/>
    <caja x="22" y="96" ancho="126" alto="24" rol="numero" fondo="0.16" tamano="12" texto="{{t:fruta}}"/>
    <flecha puntos="152,80 196,80" rol="tinta"/>
    <text x="170" y="152" font-size="12" text-anchor="middle" fill="@tinta">{{t:paso-1}}</text>
  </g>
  <g data-paso="2" data-hasta="2">
    <caja x="22" y="56" ancho="126" alto="48" rol="hueco" discontinua="" fondo="0.06" tamano="12" texto="{{t:vacia}}"/>
    <text x="170" y="152" font-size="12" text-anchor="middle" fill="@tinta">{{t:paso-2}}</text>
  </g>
</svg>
