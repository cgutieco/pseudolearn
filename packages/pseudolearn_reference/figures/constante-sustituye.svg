    <text x="10" y="110" font-size="12" fill="@atenuado">{{t:memoria}}</text>
    <caja x="10" y="118" ancho="100" alto="40" rol="numero" fondo="0.16" fuente="mono" texto="100.0"/>
    <text x="60" y="174" font-size="12" text-anchor="middle" font-family="mono" fill="@tinta">{{codigo:base}}</text>
    <caja x="130" y="118" ancho="200" alto="40" rol="atenuado" discontinua="" fondo="0.0" colortexto="atenuado" texto="{{t:sinCaja}}"/>
  </g>
