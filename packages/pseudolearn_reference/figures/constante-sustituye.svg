<svg viewBox="0 0 340 180">
  <caja x="10" y="10" ancho="320" alto="30" rol="acento-estructurado" fondo="0.08" fuente="mono" tamano="12" texto="{{codigo:Constante SEMANA Como Entero &lt;- 7 * 24;}}"/>
  <caja x="10" y="48" ancho="320" alto="30" rol="atenuado" fondo="0.04" fuente="mono" tamano="12" texto="{{codigo:Escribir base, SEMANA;}}"/>
  <g data-paso="2">
    <rect x="10" y="10" width="320" height="30" rx="6" fill="@superficie"/>
    <caja x="10" y="10" ancho="320" alto="30" rol="numero" fondo="0.14" fuente="mono" tamano="12" texto="{{codigo:Constante SEMANA Como Entero &lt;- 168;}}"/>
  </g>
  <g data-paso="3">
    <rect x="10" y="48" width="320" height="30" rx="6" fill="@superficie"/>
