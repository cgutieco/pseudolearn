  <caja x="80" y="120" ancho="180" alto="42" rol="acento-estructurado" fondo="0.10" fuente="mono" tamano="13" texto="{{codigo:Principal}}"/>
  <g data-paso="2" data-hasta="2">
    <rect x="80" y="120" width="180" height="42" rx="6" fill="@superficie"/>
