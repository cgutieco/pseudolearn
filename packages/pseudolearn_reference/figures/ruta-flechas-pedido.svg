<svg viewBox="0 0 340 200">
  <text x="40" y="42" font-size="13" text-anchor="middle" font-family="mono" fill="@tinta">{{codigo:pedido}}</text>
  <text x="40" y="98" font-size="13" text-anchor="middle" font-family="mono" fill="@tinta">{{codigo:copia}}</text>
  <g data-paso="1" data-hasta="1">
    <caja x="150" y="20" ancho="180" alto="70" rol="acento-objetos" fondo="0.14" texto="{{t:pedido}}¶{{t:jugo-sandwich}}" tamano="12"/>
    <flecha puntos="72,38 146,46" rol="acento-objetos"/>
    <flecha puntos="66,94 146,70" rol="acento-objetos"/>
  </g>
  <g data-paso="2" data-hasta="2">
    <caja x="150" y="20" ancho="180" alto="70" rol="acento-objetos" fondo="0.14" texto="{{t:pedido}}¶{{t:jugo-sandwich}}¶{{t:alfajor}}" tamano="12"/>
    <flecha puntos="72,38 146,46" rol="acento-objetos"/>
    <flecha puntos="66,94 146,70" rol="acento-objetos"/>
    <text x="240" y="112" font-size="12" text-anchor="middle" fill="@error">{{t:uno-solo}}</text>
  </g>
  <g data-paso="3">
    <caja x="150" y="14" ancho="180" alto="56" rol="acento-objetos" fondo="0.14" texto="{{t:pedido}}¶{{t:jugo-sandwich}}" tamano="12"/>
    <caja x="150" y="100" ancho="180" alto="70" rol="acento-objetos" fondo="0.08" texto="{{t:otro-pedido}}¶{{t:jugo-sandwich}}¶{{t:alfajor}}" tamano="12"/>
    <flecha puntos="72,38 146,40" rol="acento-objetos"/>
    <flecha puntos="66,98 146,128" rol="acento-objetos"/>
    <text x="240" y="190" font-size="12" text-anchor="middle" fill="@exito">{{t:dos}}</text>
  </g>
</svg>
