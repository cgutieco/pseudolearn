  <text x="22" y="52" font-size="12" font-family="mono" fill="@error">{{t:codigo}}</text>
  <text x="22" y="72" font-size="12" font-family="mono" fill="@tinta">{{t:clase}}</text>
  <text x="22" y="92" font-size="12" font-family="mono" fill="@tinta">{{t:tramo}}</text>
  <text x="22" y="112" font-size="12" font-family="mono" fill="@acento-procedimental">{{t:argumentos}}</text>
  <flecha puntos="170,132 170,156"/>
