<svg viewBox="0 0 340 190">
  <rect x="10" y="10" width="190" height="170" rx="12" fill="@tipo" fill-opacity="0.06" stroke="@tipo" stroke-width="1.5"/>
  <text x="105" y="34" font-size="14" text-anchor="middle" fill="@tipo" font-weight="600">{{t:tipo}}</text>
  <caja x="30" y="48" ancho="150" alto="34" rol="error" fondo="0.16" fuente="mono" texto="{{t:rojo}}"/>
  <caja x="30" y="90" ancho="150" alto="34" rol="numero" fondo="0.16" fuente="mono" texto="{{t:amarillo}}"/>
  <caja x="30" y="132" ancho="150" alto="34" rol="exito" fondo="0.20" fuente="mono" negrita="" texto="{{t:verde}}"/>
  <caja x="240" y="122" ancho="90" alto="54" rol="tinta" fondo="0.05" fuente="mono" texto="{{t:luz}}"/>
  <flecha puntos="240,149 184,149" rol="exito" trazo="2"/>
  <text x="285" y="112" font-size="12" text-anchor="middle" fill="@atenuado">{{t:variable}}</text>
  <text x="270" y="40" font-size="12" text-anchor="middle" fill="@atenuado">{{t:cerrada}}</text>
  <text x="270" y="58" font-size="12" text-anchor="middle" fill="@atenuado">{{t:cerrada2}}</text>
</svg>
