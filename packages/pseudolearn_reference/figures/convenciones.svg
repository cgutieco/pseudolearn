<svg viewBox="0 0 340 300">
  <text x="12" y="24" font-size="13" fill="@atenuado">{{t:pildora}}</text>
  <caja x="12" y="34" ancho="56" alto="30" esquina="6" rol="atenuado" fondo="0.12" fuente="mono" colortexto="acento-estructurado" negrita="" texto="{{lex:ifKeyword}}"/>
  <text x="80" y="54" font-size="13" fill="@tinta">{{t:pildora-nota}}</text>
  <text x="12" y="96" font-size="13" fill="@atenuado">{{t:hueco}}</text>
  <caja x="12" y="106" ancho="120" alto="30" esquina="6" rol="hueco" fondo="0.12" discontinua="" cursiva="" tamano="13" texto="{{t:condicion}}"/>
  <text x="144" y="126" font-size="13" fill="@tinta">{{t:hueco-nota}}</text>
  <text x="12" y="168" font-size="13" fill="@atenuado">{{t:programa}}</text>
  <rect x="12" y="178" width="316" height="112" rx="10" fill="@superficie" stroke="@atenuado" stroke-width="1.5"/>
  <rect x="12" y="178" width="316" height="26" rx="10" fill="@atenuado" fill-opacity="0.12"/>
  <text x="24" y="196" font-size="12" fill="@tinta" font-weight="600">{{t:titulo-programa}}</text>
  <text x="316" y="196" font-size="12" fill="@exito" text-anchor="end">✓</text>
  <text x="24" y="224" font-size="13" font-family="mono" fill="@atenuado">1</text>
  <text x="44" y="224" font-size="13" font-family="mono" fill="@acento-estructurado">{{lex:write}}</text>
  <text x="128" y="224" font-size="13" font-family="mono" fill="@texto">"…"</text>
  <rect x="12" y="240" width="316" height="50" fill="@tinta" fill-opacity="0.06"/>
  <text x="24" y="260" font-size="12" fill="@atenuado">{{t:salida}}</text>
  <text x="24" y="280" font-size="13" font-family="mono" fill="@tinta">{{t:salida-texto}}</text>
</svg>
