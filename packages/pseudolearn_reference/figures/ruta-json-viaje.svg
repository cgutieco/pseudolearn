  <text x="60" y="24" font-size="12" text-anchor="middle" fill="@acento-procedimental">{{t:programa-a}}</text>
  <caja x="10" y="36" ancho="100" alto="56" rol="acento-procedimental" fondo="0.16" tamano="12" texto="{{t:registro}}"/>
  <flecha puntos="112,64 128,64" rol="tinta"/>
  <caja x="130" y="36" ancho="80" alto="56" rol="texto" fondo="0.14" tamano="12" texto="{{t:texto}}"/>
  <text x="170" y="110" font-size="12" text-anchor="middle" font-family="mono" fill="@texto">{{t:json}}</text>
  <flecha puntos="212,64 228,64" rol="tinta"/>
