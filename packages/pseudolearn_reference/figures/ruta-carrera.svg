<svg viewBox="0 0 340 150">
  <text x="10" y="62" font-size="12" fill="@tinta">{{t:norte}}</text>
  <text x="10" y="106" font-size="12" fill="@tinta">{{t:sur}}</text>
  <rect x="60" y="42" width="236" height="30" rx="6" fill="@superficie" stroke="@atenuado"/>
  <rect x="60" y="86" width="236" height="30" rx="6" fill="@superficie" stroke="@atenuado"/>
  <line x1="300" y1="36" x2="300" y2="122" stroke="@exito" fill="none"/>
  <text x="318" y="82" font-size="12" text-anchor="middle" fill="@exito">{{t:meta}}</text>
  <text x="170" y="144" font-size="12" text-anchor="middle" fill="@atenuado">{{t:pie}}</text>
  <g data-paso="1" data-hasta="1">
    <caja x="66" y="46" ancho="62" alto="22" rol="acento-estructurado" fondo="0.18" tamano="12" texto="{{t:oferta}}"/>
    <caja x="66" y="90" ancho="62" alto="22" rol="acento-estructurado" fondo="0.18" tamano="12" texto="{{t:oferta}}"/>
    <text x="170" y="22" font-size="12" text-anchor="middle" fill="@tinta">{{t:paso-1}}</text>
  </g>
  <g data-paso="2" data-hasta="2">
    <caja x="232" y="46" ancho="62" alto="22" rol="exito" fondo="0.18" tamano="12" texto="{{t:atendida}}"/>
    <caja x="150" y="90" ancho="62" alto="22" rol="acento-estructurado" fondo="0.18" tamano="12" texto="{{t:oferta}}"/>
    <text x="170" y="22" font-size="12" text-anchor="middle" fill="@tinta">{{t:paso-2}}</text>
  </g>
  <g data-paso="3" data-hasta="3">
    <caja x="232" y="46" ancho="62" alto="22" rol="exito" fondo="0.18" tamano="12" texto="{{t:atendida}}"/>
    <caja x="150" y="90" ancho="62" alto="22" rol="error" fondo="0.18" tamano="12" texto="{{t:cortada}}"/>
    <text x="170" y="22" font-size="12" text-anchor="middle" fill="@tinta">{{t:paso-3}}</text>
  </g>
</svg>
