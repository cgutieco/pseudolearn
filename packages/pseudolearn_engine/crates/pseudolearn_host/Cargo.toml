[package]
name = "pseudolearn_host"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cap-std = "4.0.3"
bytes = "=1.12.1"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
http = "=1.5.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "=0.7.1"
tokio = { version = "=1.54.1", features = ["io-util", "net", "rt", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
getrandom = "=0.2.17"
jiff = { version = "=0.2.37", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }

[lints]
workspace = true
