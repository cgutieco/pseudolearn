[package]
name = "pseudolearn_codegen"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
pseudolearn_ir = { path = "../pseudolearn_ir", version = "=0.1.0" }
pseudolearn_diagnostics = { path = "../pseudolearn_diagnostics", version = "=0.1.0" }
pseudolearn_aot_rt = { path = "../pseudolearn_aot_rt", version = "=0.1.0" }
cranelift-codegen = { version = "0.137.1", features = ["x86", "arm64"] }
cranelift-frontend = "0.137.1"
cranelift-module = "0.137.1"
cranelift-object = "0.137.1"
target-lexicon = "0.13.5"

[dev-dependencies]
object = { version = "0.41", default-features = false, features = ["read"] }
