[advisories]
version = 2
[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Zlib", "BSD-3-Clause"]
[licenses.private]
ignore = true
[bans]
multiple-versions = "deny"
skip = [{ crate = "hashbrown@0.16.1" }]
wildcards = "deny"
[sources]
unknown-registry = "deny"
unknown-git = "deny"
