[workspace]
members = [
    "crates/pseudolearn_source",
    "crates/pseudolearn_diagnostics",
    "crates/pseudolearn_lexicon",
    "crates/pseudolearn_syntax",
    "crates/pseudolearn_semantic",
    "crates/pseudolearn_api",
    "crates/pseudolearn_conformance",
    "xtask",
]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"
