[workspace]
members = ["crates/ceiling_kernels", "crates/ceiling_statistics", "crates/ceiling_runner", "xtask"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
