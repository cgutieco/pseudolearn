[workspace]
members = ["crates/see_model", "crates/see_format", "crates/see_oracles", "crates/see_graph", "crates/see_change", "crates/see_validation", "crates/see_translation", "crates/see_generators", "crates/see_conformance", "crates/see_export", "crates/see_report", "crates/see_cli", "xtask"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"
