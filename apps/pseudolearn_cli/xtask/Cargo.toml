[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0"

[lints]
workspace = true
