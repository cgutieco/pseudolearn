package: pseudolearn_cli
generated_sources: [generated]
layers:
  - name: pseudolearn_cli
    path: .
    may_import: []
    permitted_path_dependencies: [pseudolearn_api]
    external_dependencies: [serde, serde_json, cap-std, pseudolearn_api, bytes, flate2, http, http-body-util, hyper, hyper-util, rustls, rustls-native-certs, tokio, tokio-rustls]
    unsafe_allowed: false
  - name: xtask
    path: xtask
    may_import: []
    external_dependencies: []
    unsafe_allowed: false
    tooling: true
limits:
  file_lines: 300
  function_lines: 40
  positional_parameters: 4
  nesting_depth: 3
  public_methods_per_class: 7
  unsafe_function_lines: 10
names:
  minimum_length: 3
  permitted_short: [id, io, ir, vm, gc, os]
  forbidden_components: [ctx, cfg, env, expr, stmt, decl, tok, idx, len, pos, cnt, num, buf, ptr, ref, val, msg, err, res, ret, args, params, attrs, tmp, temp, aux, data, info, item, obj, thing, stuff, foo, bar]
  forbidden_files: [utils, helpers, common, misc]
