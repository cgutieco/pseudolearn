[package]
name = "pseudolearn_cli"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "pseudo"
path = "src/main.rs"

[dependencies]
pseudolearn_api = { path = "../../packages/pseudolearn_engine/crates/pseudolearn_api", version = "=0.1.0", features = ["native"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cap-std = "4.0.3"
bytes = "=1.12.1"
http = "=1.5.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.5"
tokio = { version = "=1.54.1", features = ["io-util", "net", "rt", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }

[workspace]
members = [
    ".",
    "xtask",
]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[lints]
workspace = true

[build-dependencies]
serde_json = "1"
