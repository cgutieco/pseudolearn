[package]
name = "pseudolearn_cli"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[[bin]]
name = "pseudo"
path = "src/main.rs"

[features]
default = []
test-host = []

[dependencies]
pseudolearn_host = { path = "../../packages/pseudolearn_engine/crates/pseudolearn_host", version = "=0.1.0" }
pseudolearn_api = { path = "../../packages/pseudolearn_engine/crates/pseudolearn_api", version = "=0.1.0", features = ["native"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cap-std = "4.0.3"
object = { version = "0.41", default-features = false, features = ["read"] }
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
sha2 = "=0.11.1"

[workspace]
members = [
    ".",
    "xtask",
]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[lints]
workspace = true

[build-dependencies]
serde_json = "1"
object = { version = "0.41", default-features = false, features = ["read"] }
