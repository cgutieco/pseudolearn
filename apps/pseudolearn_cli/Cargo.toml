[package]
name = "pseudolearn_cli"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "pseudo"
path = "src/main.rs"

[dependencies]
pseudolearn_api = { path = "../../packages/pseudolearn_engine/crates/pseudolearn_api", version = "=0.1.0", features = ["native"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cap-std = "4.0.3"

[workspace]
members = [
    ".",
    "xtask",
]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[lints]
workspace = true

[build-dependencies]
serde_json = "1"
