[package]
name = "pseudolearn_bridge"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
pseudolearn_api = { path = "../../../packages/pseudolearn_engine/crates/pseudolearn_api", version = "=0.1.0" }
serde_json = "1.0"

[lints.rust]
unsafe_code = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
arithmetic_side_effects = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"
