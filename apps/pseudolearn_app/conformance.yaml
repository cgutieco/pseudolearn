  - regla: API.WIRE-FORMAT@0.1.0#R3
    verificacion: ejecutor
    estado: pendiente
    resuelve_en: validacion-plataforma-posterior
    justificacion: Requiere transporte Wasm real; las comprobaciones nativas no
      acreditan crecimiento de memoria Wasm. La validación posterior comienza
      solo en macOS e iOS y no certifica esa frontera.
