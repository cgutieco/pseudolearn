name: pseudolearn_app
description: Flutter application for PseudoLearn.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '^3.5.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  pseudolearn_core:
    path: ../../packages/pseudolearn_core
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  go_router: ^18.0.1
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2+1
  path: ^1.9.1
  path_provider: ^2.1.6
  markdown: ^7.3.1
  supabase: ^2.16.1
  crypto: ^3.0.7
  sign_in_with_apple: ^8.2.0
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^11.0.0
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  analyzer: ^13.0.0
  http: ^1.6.0
  flutter_lints: ^6.0.0
  lints: ^6.1.0
  yaml: ^3.1.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/
    - assets/knowledge/
    - assets/knowledge/examples/
    - assets/knowledge/exercises/
    - assets/knowledge/modules/
    - assets/knowledge/specification/
    - assets/knowledge/support/

  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600

